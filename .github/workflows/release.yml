name: Android release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The action's legacy default includes the removed SDK package "tools".
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Load the persistent private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FASTCLOUD_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure Android signing secrets in the mobile repository first'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fastcloud-mobile.p12"
          echo "FASTCLOUD_ANDROID_KEYSTORE=$RUNNER_TEMP/fastcloud-mobile.p12" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check && npm test
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: npm run build && npx cap sync android
      - run: chmod +x android/gradlew
      - name: Build and verify the signed APK
        env:
          FASTCLOUD_ANDROID_STORE_PASSWORD: ${{ secrets.FASTCLOUD_ANDROID_STORE_PASSWORD }}
          FASTCLOUD_ANDROID_KEY_ALIAS: ${{ secrets.FASTCLOUD_ANDROID_KEY_ALIAS }}
          FASTCLOUD_ANDROID_KEY_PASSWORD: ${{ secrets.FASTCLOUD_ANDROID_KEY_PASSWORD }}
        run: node tools/build-android.mjs
      - run: python tools/stage-android-release.py
      - name: Publish the Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/Veirune-Mobile-*.apk release/latest-android.json --verify-tag --title "Veirune Mobile ${GITHUB_REF_NAME#v}" --notes-file release/notes.md
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/fastcloud-mobile.p12"
